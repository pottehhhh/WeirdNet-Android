name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HEV_COMMIT: 941c758101385d145c66210ac88991daaf27d4b6
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build WEIRDNET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.0.12077973"

      - name: Show Android tool versions
        shell: bash
        run: |
          set -euo pipefail

          java -version
          adb version
          sdkmanager --version
          "$ANDROID_HOME/ndk/27.0.12077973/ndk-build" --version

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | head -200

          echo
          echo "Gradle projects:"
          find . -maxdepth 5 -name settings.gradle -o -name settings.gradle.kts

      - name: Extract project ZIP if needed
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "WeirdNet" ] && [ -f "WeirdNet/settings.gradle.kts" ]; then
            echo "WeirdNet directory already exists."
            exit 0
          fi

          ZIP="$(find . -maxdepth 3 -type f -name '*.zip' | head -1 || true)"

          if [ -z "$ZIP" ]; then
            echo "No project ZIP found."
            exit 0
          fi

          echo "Using project ZIP: $ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          echo
          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | sort | head -200

      - name: Find Android project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_ROOT=""

          if [ -f "WeirdNet/settings.gradle.kts" ]; then
            PROJECT_ROOT="WeirdNet"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_ROOT="."
          elif [ -f "extracted/WeirdNet/settings.gradle.kts" ]; then
            PROJECT_ROOT="extracted/WeirdNet"
          else
            FOUND="$(find . -type f -name settings.gradle.kts -print -quit || true)"

            if [ -n "$FOUND" ]; then
              PROJECT_ROOT="$(dirname "$FOUND")"
            fi
          fi

          if [ -z "$PROJECT_ROOT" ]; then
            echo "Could not find Android Gradle project."
            exit 1
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Android project root: $PROJECT_ROOT"

      - name: Patch WireGuard traffic API
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt"

          if [ ! -f "$FILE" ]; then
            echo "WireGuardEngine.kt not found:"
            echo "$FILE"
            exit 1
          fi

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          old_blocks = [
              """var totalRx = 0L
          var totalTx = 0L
          for (peer in stats.peers()) {
              totalRx += stats.peerRx(peer)
              totalTx += stats.peerTx(peer)
          }""",

              """var totalRx = 0L
          var totalTx = 0L
          for (peer in stats.peers()) {
              totalRx += stats.rx(peer)
              totalTx += stats.tx(peer)
          }"""
          ]

          new_block = """val totalRx = stats.totalRx()
          val totalTx = stats.totalTx()"""

          changed = False

          for old in old_blocks:
              if old in s:
                  s = s.replace(old, new_block)
                  changed = True

          if not changed:
              if "stats.peerRx(peer)" in s or "stats.peerTx(peer)" in s:
                  s = s.replace("stats.peerRx(peer)", "stats.totalRx()")
                  s = s.replace("stats.peerTx(peer)", "stats.totalTx()")
                  changed = True

          if not changed:
              if "stats.rx(peer)" in s or "stats.tx(peer)" in s:
                  s = s.replace("stats.rx(peer)", "stats.totalRx()")
                  s = s.replace("stats.tx(peer)", "stats.totalTx()")
                  changed = True

          p.write_text(s)

          print("Patched:", p)
          PY

          echo
          echo "Current traffic implementation:"
          grep -n -A15 -B3 "currentTraffic" "$FILE"

      - name: Patch missing Compose padding import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/ui/WeirdNetNavHost.kt"

          if [ ! -f "$FILE" ]; then
            echo "NavHost file not found; skipping."
            exit 0
          fi

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          imp = "import androidx.compose.foundation.layout.padding"

          if imp not in s and "Modifier.padding(" in s:
              lines = s.splitlines()

              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      insert_at = i + 1

              lines.insert(insert_at, imp)
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")
              p.write_text(s)

              print("Added padding import.")
          else:
              print("Padding import already present or not required.")
          PY

      - name: Patch Accompanist rationale import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/ui/screens/QrScanScreen.kt"

          if [ ! -f "$FILE" ]; then
            echo "QrScanScreen.kt not found; skipping."
            exit 0
          fi

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "shouldShowRationale" not in s:
              print("shouldShowRationale is not used.")
              raise SystemExit(0)

          imp = "import com.google.accompanist.permissions.shouldShowRationale"

          if imp not in s:
              lines = s.splitlines()

              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      insert_at = i + 1

              lines.insert(insert_at, imp)
              s = "\n".join(lines) + ("\n" if s.endswith("\n") else "")
              p.write_text(s)

              print("Added shouldShowRationale import.")
          else:
              print("Rationale import already present.")
          PY

      - name: Verify source patches
        shell: bash
        run: |
          set -euo pipefail

          WG="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt"

          echo "Checking WireGuard API..."

          if grep -n "peerRx(peer)" "$WG"; then
            echo "ERROR: peerRx(peer) still exists."
            exit 1
          fi

          if grep -n "peerTx(peer)" "$WG"; then
            echo "ERROR: peerTx(peer) still exists."
            exit 1
          fi

          if ! grep -n "stats.totalRx()" "$WG"; then
            echo "ERROR: stats.totalRx() not found."
            exit 1
          fi

          if ! grep -n "stats.totalTx()" "$WG"; then
            echo "ERROR: stats.totalTx() not found."
            exit 1
          fi

          echo "WireGuard traffic API patch verified."

      - name: Download Xray Android library
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_ROOT/app/libs"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            -o "$PROJECT_ROOT/app/libs/AndroidLibXrayLite.aar" \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/AndroidLibXrayLite.aar"

          ls -lh "$PROJECT_ROOT/app/libs/AndroidLibXrayLite.aar"

      - name: Build HEV SOCKS5 tunnel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hev-android
          mkdir -p hev-android

          git clone \
            --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel.git \
            hev-android/jni

          cd hev-android/jni

          git fetch --depth 1 origin "$HEV_COMMIT"
          git checkout "$HEV_COMMIT"

          git submodule update --init --recursive

          cd ..

          ln -sf . jni

          export NDK_PROJECT_PATH="$PWD"
          export NDK_APPLICATION_MK="$PWD/jni/Application.mk"

          "$ANDROID_HOME/ndk/27.0.12077973/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            NDK_APPLICATION_MK="$PWD/jni/Application.mk" \
            V=1

          echo
          echo "HEV build outputs:"
          find . -type f \
            \( -name '*.so' -o -name '*.a' \) \
            -print | sort

      - name: Package HEV AAR
        shell: bash
        run: |
          set -euo pipefail

          HEV_AAR="$PROJECT_ROOT/app/libs/hev-socks5-tunnel.aar"

          rm -rf hev-aar
          mkdir -p hev-aar/jni

          find hev-android \
            -type f \
            -name '*.so' \
            -print

          found=0

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SRC="$(find hev-android -type f -path "*/libs/$abi/*.so" -o -type f -path "*/obj/local/$abi/*.so" | head -1 || true)"

            if [ -n "$SRC" ]; then
              mkdir -p "hev-aar/jni/$abi"
              cp "$SRC" "hev-aar/jni/$abi/"
              found=1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: No HEV shared libraries were found."
            find hev-android -type f | sort | head -300
            exit 1
          fi

          cd hev-aar
          zip -qr "../hev-socks5-tunnel.aar" .
          cd ..

          cp hev-socks5-tunnel.aar "$HEV_AAR"

          echo
          echo "HEV AAR:"
          ls -lh "$HEV_AAR"

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_ROOT/gradle"

          PROPS="$PROJECT_ROOT/gradle.properties"

          touch "$PROPS"

          if ! grep -q "^android.suppressUnsupportedCompileSdk=35$" "$PROPS"; then
            echo "android.suppressUnsupportedCompileSdk=35" >> "$PROPS"
          fi

          echo
          echo "gradle.properties:"
          cat "$PROPS"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Show Gradle version
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -euo pipefail

          echo "APK files:"
          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Build-Reports
          path: |
            ${{ env.PROJECT_ROOT }}/app/build/reports/**
          if-no-files-found: warn
          retention-days: 7
