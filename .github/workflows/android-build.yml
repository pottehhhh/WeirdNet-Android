name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build WEIRDNET APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project
        shell: bash
        run: |
          set -e

          mkdir -p extracted
          unzip -q "WeirdNet-Android-Project-GitHub-Build-Ready.zip" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

          if [ -f "extracted/WeirdNet/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=extracted/WeirdNet" >> "$GITHUB_ENV"
          elif [ -f "extracted/WeirdNet/WeirdNet/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=extracted/WeirdNet/WeirdNet" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle.kts was not found."
            find extracted -name settings.gradle.kts -print
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify required Android SDK packages
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK 35:"
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-35"

          echo "Build tools 35.0.0:"
          ls -ld "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Prepare native libraries directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          mkdir -p app/libs
          rm -f app/libs/libv2ray.aar
          rm -f app/libs/hev-socks5-tunnel.aar

      - name: Download Xray native AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          gh release download v26.6.2 \
            --repo 2dust/AndroidLibXrayLite \
            --pattern "libv2ray.aar" \
            --dir app/libs \
            --clobber

          test -s app/libs/libv2ray.aar

      - name: Download HEV native AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e

          gh release download 2.15.0 \
            --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel.aar" \
            --dir app/libs \
            --clobber

          test -s app/libs/hev-socks5-tunnel.aar

      - name: Verify native AAR files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Native libraries:"
          ls -lh app/libs/*.aar

          echo "libv2ray.aar:"
          file app/libs/libv2ray.aar

          echo "hev-socks5-tunnel.aar:"
          file app/libs/hev-socks5-tunnel.aar

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          chmod +x gradlew

      - name: Show Java and Gradle versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon clean

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK_COUNT=$(find app/build/outputs/apk/debug -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            find app/build/outputs -type f -print || true
            exit 1
          fi

          echo "Generated APK:"
          find app/build/outputs/apk/debug -type f -name "*.apk" -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
