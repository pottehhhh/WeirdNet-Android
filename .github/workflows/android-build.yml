name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      JAVA_VERSION: "17"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          unzip -q "WeirdNet-Android-Project-GitHub-Build-Ready.zip" -d extracted

          if [ -f extracted/WeirdNet/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/WeirdNet" >> $GITHUB_ENV
          elif [ -f extracted/WeirdNet/WeirdNet/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/WeirdNet/WeirdNet" >> $GITHUB_ENV
          else
            echo "settings.gradle.kts not found"
            find extracted -name settings.gradle.kts
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Xray AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs

          gh release download v26.6.2 \
            --repo 2dust/AndroidLibXrayLite \
            --pattern "libv2ray.aar" \
            --dir app/libs \
            --clobber

      - name: Download HEV AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs

          gh release download 2.15.0 \
            --repo heiher/hev-socks5-tunnel \
            --pattern "hev-socks5-tunnel.aar" \
            --dir app/libs \
            --clobber

      - name: Verify native libraries
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -s app/libs/libv2ray.aar
          test -s app/libs/hev-socks5-tunnel.aar
          ls -lh app/libs

      - name: Make Gradle executable
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew

      - name: Gradle clean
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon clean

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
