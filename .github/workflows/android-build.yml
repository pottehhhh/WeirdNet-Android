name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HEV_COMMIT: 941c758101385d145c66210ac88991daaf27d4b6
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build WEIRDNET APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Extract Android project from ZIP
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          test -f "WeirdNet-Android-Project-GitHub-Build-Ready.zip"

          unzip -q \
            "WeirdNet-Android-Project-GitHub-Build-Ready.zip" \
            -d extracted

          if [[ -f "extracted/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet" >> "$GITHUB_ENV"

          elif [[ -f "extracted/WeirdNet/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet/WeirdNet" >> "$GITHUB_ENV"

          else
            echo "ERROR: Could not locate settings.gradle.kts"
            echo
            echo "Found files:"
            find extracted -maxdepth 5 -type f | sort
            echo
            echo "Searching for settings.gradle.kts:"
            find extracted -name settings.gradle.kts -print
            exit 1
          fi

          echo
          echo "PROJECT_DIR:"
          grep "^PROJECT_DIR=" "$GITHUB_ENV"

      # ============================================================
      # 3. Setup Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. Setup Gradle directly
      #
      # The project ZIP does not contain gradlew or gradle-wrapper.jar.
      # Therefore we intentionally install Gradle 8.7 directly.
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      # ============================================================
      # 5. Verify Java + Gradle
      # ============================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Gradle executable:"
          command -v gradle

      # ============================================================
      # 6. Setup Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # 7. Verify Android SDK
      # ============================================================
      - name: Verify Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          sdkmanager --version

      # ============================================================
      # 8. Accept Android SDK licenses
      # ============================================================
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true

      # ============================================================
      # 9. Install Android SDK 35
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 10. Verify Android SDK 35
      # ============================================================
      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK 35 is installed successfully."

      # ============================================================
      # 11. Prepare app/libs
      # ============================================================
      - name: Prepare app native libraries directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs

          rm -f app/libs/libv2ray.aar
          rm -f app/libs/hev-socks5-tunnel.aar

          echo "app/libs prepared."

      # ============================================================
      # 12. Download Xray native AAR
      # ============================================================
      - name: Download Xray native AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download v26.6.2 \
            --repo 2dust/AndroidLibXrayLite \
            --pattern "libv2ray.aar" \
            --dir app/libs \
            --clobber

          test -s app/libs/libv2ray.aar

          echo
          echo "Xray AAR:"
          ls -lh app/libs/libv2ray.aar

      # ============================================================
      # 13. Prepare HEV source
      #
      # Official HEV Android build layout:
      #
      # hev-android/
      # └── jni/
      #     ├── Android.mk
      #     ├── Application.mk
      #     └── ...
      #
      # ndk-build runs from hev-android, not hev-android/jni.
      # ============================================================
      - name: Prepare HEV source for Android NDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hev-android

          mkdir -p hev-android

          git clone --recursive \
            "https://github.com/heiher/hev-socks5-tunnel.git" \
            hev-android/jni

          cd hev-android/jni

          git checkout "$HEV_COMMIT"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo
          echo "HEV commit:"
          git rev-parse HEAD

          echo
          echo "Checking HEV Android build files..."

          test -f Android.mk
          test -f Application.mk

          echo "Android.mk: OK"
          echo "Application.mk: OK"

      # ============================================================
      # 14. Download Android NDK r27d
      # ============================================================
      - name: Download Android NDK r27d
        shell: bash
        run: |
          set -euo pipefail

          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"

          unzip -q android-ndk-r27d-linux.zip

          test -x "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build"

          echo
          echo "NDK version:"
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" --version

      # ============================================================
      # 15. Build HEV native libraries
      # ============================================================
      - name: Build HEV native library
        working-directory: hev-android
        shell: bash
        run: |
          set -euo pipefail

          echo "HEV Android build directory:"
          pwd

          echo
          echo "Checking jni directory:"
          test -d jni
          ls -la jni

          echo
          echo "Cleaning HEV build..."
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" clean

          echo
          echo "Building HEV..."
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" \
            APP_MODULES=hev-socks5-tunnel \
            -j"$(nproc)"

          echo
          echo "Checking generated libraries..."

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            test -s "libs/$abi/libhev-socks5-tunnel.so"
            echo "OK: libs/$abi/libhev-socks5-tunnel.so"
          done

          echo
          echo "HEV native libraries:"
          find libs \
            -type f \
            -name "libhev-socks5-tunnel.so" \
            -print

      # ============================================================
      # 16. Package HEV AAR
      # ============================================================
      - name: Package HEV AAR
        working-directory: hev-android
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aar

          mkdir -p aar/jni

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            mkdir -p "aar/jni/$abi"

            cp \
              "libs/$abi/libhev-socks5-tunnel.so" \
              "aar/jni/$abi/"
          done

          cat > aar/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="hev.socks5.tunnel">
              <uses-sdk android:minSdkVersion="29" />
          </manifest>
          EOF

          (
            cd aar
            zip -q -r ../hev-socks5-tunnel.aar .
          )

          test -s hev-socks5-tunnel.aar

          echo
          echo "HEV AAR created:"
          ls -lh hev-socks5-tunnel.aar

      # ============================================================
      # 17. Align minSdk with HEV
      # ============================================================
      - name: Align CI minSdk with HEV
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "minSdk = 26" in text:
              text = text.replace("minSdk = 26", "minSdk = 29", 1)

          elif "minSdk = 29" not in text:
              raise SystemExit(
                  "Could not find expected minSdk declaration "
                  "in app/build.gradle.kts"
              )

          path.write_text(text, encoding="utf-8")

          print("CI minSdk is now 29")
          PY

          echo
          grep -n "minSdk" app/build.gradle.kts

      # ============================================================
      # 18. Copy HEV AAR into app
      # ============================================================
      - name: Copy HEV AAR into app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/hev-android/hev-socks5-tunnel.aar" \
            app/libs/

          test -s app/libs/hev-socks5-tunnel.aar

          echo
          echo "AAR files:"
          ls -lh app/libs/*.aar

      # ============================================================
      # 19. Verify AAR contents
      # ============================================================
      - name: Verify AAR contents
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ Xray AAR ================"
          unzip -l app/libs/libv2ray.aar | head -60

          echo
          echo "================ HEV AAR ================="
          unzip -l app/libs/hev-socks5-tunnel.aar | head -60

      # ============================================================
      # 20. Verify Android project structure
      # ============================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure:"
          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name "settings.gradle.kts" \
              -o -name "build.gradle.kts" \
            \) \
            -print

      # ============================================================
      # 21. Clean Gradle project
      #
      # IMPORTANT:
      # No ./gradlew here.
      # We use the Gradle 8.7 executable installed above.
      # ============================================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            --stacktrace

      # ============================================================
      # 22. Run unit tests
      # ============================================================
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      # ============================================================
      # 23. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      # ============================================================
      # 24. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          test -n "$APK"

          echo
          echo "APK generated successfully:"
          ls -lh "$APK"

          echo
          echo "APK path:"
          echo "$APK"

      # ============================================================
      # 25. Upload APK artifact
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
