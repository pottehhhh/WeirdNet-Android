name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HEV_COMMIT: 941c758101385d145c66210ac88991daaf27d4b6

jobs:
  build:
    name: Build WEIRDNET APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted
          unzip -q "WeirdNet-Android-Project-GitHub-Build-Ready.zip" -d extracted

          if [[ -f "extracted/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet" >> "$GITHUB_ENV"
          elif [[ -f "extracted/WeirdNet/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet/WeirdNet" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle.kts not found"
            find extracted -name settings.gradle.kts -print
            exit 1
          fi

          echo "Project directory:"
          grep "^PROJECT_DIR=" "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Verify Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          command -v sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK 35 is installed."
          ls -ld "$ANDROID_SDK_ROOT/platforms/android-35"
          ls -ld "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      - name: Prepare app native libraries directory
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs

          rm -f app/libs/libv2ray.aar
          rm -f app/libs/hev-socks5-tunnel.aar

      - name: Download Xray native AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download v26.6.2 \
            --repo 2dust/AndroidLibXrayLite \
            --pattern "libv2ray.aar" \
            --dir app/libs \
            --clobber

          test -s app/libs/libv2ray.aar

          echo "Xray AAR:"
          ls -lh app/libs/libv2ray.aar

      - name: Clone HEV source
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive \
            "https://github.com/heiher/hev-socks5-tunnel.git" \
            hev-src

          cd hev-src

          git checkout "$HEV_COMMIT"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "HEV commit:"
          git rev-parse HEAD

      - name: Download Android NDK r27d
        shell: bash
        run: |
          set -euo pipefail

          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"

          unzip -q android-ndk-r27d-linux.zip

          test -x "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build"

          echo "NDK ready:"
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" --version

      - name: Build HEV native library
        working-directory: hev-src
        shell: bash
        run: |
          set -euo pipefail

          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" clean

          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" \
            APP_MODULES=hev-socks5-tunnel \
            -j"$(nproc)"

          echo "Checking generated native libraries..."

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            test -s "libs/$abi/libhev-socks5-tunnel.so"
            echo "OK: libs/$abi/libhev-socks5-tunnel.so"
          done

      - name: Package HEV AAR
        working-directory: hev-src
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aar
          mkdir -p aar/jni

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            mkdir -p "aar/jni/$abi"

            cp \
              "libs/$abi/libhev-socks5-tunnel.so" \
              "aar/jni/$abi/"
          done

          cat > aar/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="hev.socks5.tunnel">
              <uses-sdk android:minSdkVersion="29" />
          </manifest>
          EOF

          (
            cd aar
            zip -q -r ../hev-socks5-tunnel.aar .
          )

          test -s hev-socks5-tunnel.aar

          echo "HEV AAR created:"
          ls -lh hev-socks5-tunnel.aar

      - name: Align CI minSdk with HEV
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "minSdk = 26" in text:
              text = text.replace("minSdk = 26", "minSdk = 29", 1)
          elif "minSdk = 29" not in text:
              raise SystemExit(
                  "Could not find the expected minSdk declaration "
                  "in app/build.gradle.kts"
              )

          path.write_text(text, encoding="utf-8")

          print("CI build minSdk is now 29")
          PY

          grep -n "minSdk" app/build.gradle.kts

      - name: Copy HEV AAR into app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/hev-src/hev-socks5-tunnel.aar" \
            app/libs/

          test -s app/libs/hev-socks5-tunnel.aar

          echo "Native libraries available to Gradle:"
          ls -lh app/libs/*.aar

      - name: Verify AAR contents
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          unzip -l app/libs/libv2ray.aar | head -40
          echo
          unzip -l app/libs/hev-socks5-tunnel.aar | head -40

      - name: Make Gradle wrapper executable
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew

      - name: Show Java and Gradle versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          java -version
          ./gradlew --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew --no-daemon clean

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print -quit)"

          test -n "$APK"

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
