name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HEV_COMMIT: 941c758101385d145c66210ac88991daaf27d4b6
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build WEIRDNET APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v5

      # ============================================================
      # 2. Extract Android project
      # ============================================================
      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          test -f "WeirdNet-Android-Project-GitHub-Build-Ready.zip"

          unzip -q \
            "WeirdNet-Android-Project-GitHub-Build-Ready.zip" \
            -d extracted

          if [[ -f "extracted/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet" >> "$GITHUB_ENV"

          elif [[ -f "extracted/WeirdNet/WeirdNet/settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=extracted/WeirdNet/WeirdNet" >> "$GITHUB_ENV"

          else
            echo "ERROR: settings.gradle.kts not found."

            find extracted \
              -name settings.gradle.kts \
              -print

            exit 1
          fi

          echo
          echo "Project directory:"
          grep "^PROJECT_DIR=" "$GITHUB_ENV"

      # ============================================================
      # 3. Setup Java 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 4. Setup Gradle 8.7
      #
      # Project ZIP does not contain gradlew.
      # Therefore Gradle is installed directly.
      # ============================================================
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-provider: basic

      # ============================================================
      # 5. Verify Java + Gradle
      # ============================================================
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail

          echo "Java:"
          java -version

          echo
          echo "Gradle:"
          gradle --version

          echo
          echo "Gradle executable:"
          command -v gradle

      # ============================================================
      # 6. Setup Android SDK
      # ============================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      # ============================================================
      # 7. Install Android SDK 35
      # ============================================================
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          set +o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          set -o pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ============================================================
      # 8. Verify Android SDK
      # ============================================================
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

          echo "Android SDK 35: OK"

      # ============================================================
      # 9. FIX SOURCE COMPILATION ERRORS
      #
      # These are actual source fixes found in the project:
      #
      # 1. WireGuard Statistics:
      #    rx()/tx() -> peerRx()/peerTx()
      #
      # 2. Compose:
      #    add androidx.compose.foundation.layout.padding
      #
      # 3. Accompanist:
      #    add shouldShowRationale import
      # ============================================================
      - name: Fix Kotlin source compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          WIREGUARD_FILE="app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt"
          NAV_FILE="app/src/main/java/ir/weirdnet/client/ui/nav/WeirdNetNavHost.kt"
          QR_FILE="app/src/main/java/ir/weirdnet/client/ui/qr/QrScanScreen.kt"

          echo "Checking source files..."

          test -f "$WIREGUARD_FILE"
          test -f "$NAV_FILE"
          test -f "$QR_FILE"

          # ----------------------------------------------------------
          # FIX 1: WireGuard Statistics API
          # ----------------------------------------------------------

          python3 - "$WIREGUARD_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old_rx = "totalRx += stats.rx(peer)"
          old_tx = "totalTx += stats.tx(peer)"

          new_rx = "totalRx += stats.peerRx(peer)"
          new_tx = "totalTx += stats.peerTx(peer)"

          if old_rx in text:
              text = text.replace(old_rx, new_rx, 1)

          if old_tx in text:
              text = text.replace(old_tx, new_tx, 1)

          if "stats.peerRx(peer)" not in text:
              raise SystemExit(
                  "ERROR: WireGuard peerRx() fix was not applied."
              )

          if "stats.peerTx(peer)" not in text:
              raise SystemExit(
                  "ERROR: WireGuard peerTx() fix was not applied."
              )

          path.write_text(text, encoding="utf-8")

          print("WireGuard Statistics API: FIXED")
          PY

          # ----------------------------------------------------------
          # FIX 2: Compose Modifier.padding import
          # ----------------------------------------------------------

          python3 - "$NAV_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          required_import = (
              "import androidx.compose.foundation.layout.padding"
          )

          if required_import not in text:
              marker = "import androidx.compose.material.icons.Icons"

              if marker in text:
                  text = text.replace(
                      marker,
                      required_import + "\n" + marker,
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: Could not locate import section "
                      "in WeirdNetNavHost.kt"
                  )

          if required_import not in text:
              raise SystemExit(
                  "ERROR: Compose padding import was not added."
              )

          path.write_text(text, encoding="utf-8")

          print("Compose Modifier.padding import: FIXED")
          PY

          # ----------------------------------------------------------
          # FIX 3: Accompanist shouldShowRationale import
          # ----------------------------------------------------------

          python3 - "$QR_FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          required_import = (
              "import com.google.accompanist.permissions.shouldShowRationale"
          )

          if required_import not in text:
              marker = (
                  "import com.google.accompanist.permissions."
                  "rememberPermissionState"
              )

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + "\n" + required_import,
                      1
                  )
              else:
                  raise SystemExit(
                      "ERROR: Could not locate Accompanist "
                      "permission imports."
                  )

          if required_import not in text:
              raise SystemExit(
                  "ERROR: shouldShowRationale import was not added."
              )

          path.write_text(text, encoding="utf-8")

          print("Accompanist shouldShowRationale import: FIXED")
          PY

          echo
          echo "All known Kotlin compatibility fixes applied."

      # ============================================================
      # 10. Show patched source snippets
      # ============================================================
      - name: Verify Kotlin fixes
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "================ WireGuard ================"
          grep -n "peerRx\|peerTx" \
            app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt

          echo
          echo "================ Navigation ==============="
          grep -n "foundation.layout.padding" \
            app/src/main/java/ir/weirdnet/client/ui/nav/WeirdNetNavHost.kt

          echo
          echo "================ QR Scanner ==============="
          grep -n "shouldShowRationale" \
            app/src/main/java/ir/weirdnet/client/ui/qr/QrScanScreen.kt

      # ============================================================
      # 11. Prepare app/libs
      # ============================================================
      - name: Prepare app native libraries
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/libs

          rm -f app/libs/libv2ray.aar
          rm -f app/libs/hev-socks5-tunnel.aar

      # ============================================================
      # 12. Download Xray AAR
      # ============================================================
      - name: Download Xray native AAR
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release download v26.6.2 \
            --repo 2dust/AndroidLibXrayLite \
            --pattern "libv2ray.aar" \
            --dir app/libs \
            --clobber

          test -s app/libs/libv2ray.aar

          echo
          echo "Xray AAR:"
          ls -lh app/libs/libv2ray.aar

      # ============================================================
      # 13. Prepare HEV source
      # ============================================================
      - name: Prepare HEV source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hev-android

          mkdir -p hev-android

          git clone --recursive \
            "https://github.com/heiher/hev-socks5-tunnel.git" \
            hev-android/jni

          cd hev-android/jni

          git checkout "$HEV_COMMIT"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo
          echo "HEV commit:"
          git rev-parse HEAD

          test -f Android.mk
          test -f Application.mk

          echo "Android.mk: OK"
          echo "Application.mk: OK"

      # ============================================================
      # 14. Download Android NDK r27d
      # ============================================================
      - name: Download Android NDK r27d
        shell: bash
        run: |
          set -euo pipefail

          wget -q --show-progress \
            "https://dl.google.com/android/repository/android-ndk-r27d-linux.zip"

          unzip -q android-ndk-r27d-linux.zip

          test -x "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build"

          echo
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" --version

      # ============================================================
      # 15. Build HEV
      # ============================================================
      - name: Build HEV native library
        working-directory: hev-android
        shell: bash
        run: |
          set -euo pipefail

          test -d jni
          test -f jni/Android.mk
          test -f jni/Application.mk

          echo "HEV build directory:"
          pwd

          echo
          echo "Cleaning..."
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" clean

          echo
          echo "Building..."
          "$GITHUB_WORKSPACE/android-ndk-r27d/ndk-build" \
            APP_MODULES=hev-socks5-tunnel \
            -j"$(nproc)"

          echo
          echo "Checking libraries..."

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            test -s "libs/$abi/libhev-socks5-tunnel.so"
            echo "OK: $abi"
          done

      # ============================================================
      # 16. Package HEV AAR
      # ============================================================
      - name: Package HEV AAR
        working-directory: hev-android
        shell: bash
        run: |
          set -euo pipefail

          rm -rf aar

          mkdir -p aar/jni

          for abi in \
            armeabi-v7a \
            arm64-v8a \
            x86 \
            x86_64
          do
            mkdir -p "aar/jni/$abi"

            cp \
              "libs/$abi/libhev-socks5-tunnel.so" \
              "aar/jni/$abi/"
          done

          cat > aar/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android"
              package="hev.socks5.tunnel">
              <uses-sdk android:minSdkVersion="29" />
          </manifest>
          EOF

          (
            cd aar
            zip -q -r ../hev-socks5-tunnel.aar .
          )

          test -s hev-socks5-tunnel.aar

          echo
          ls -lh hev-socks5-tunnel.aar

      # ============================================================
      # 17. Align minSdk
      # ============================================================
      - name: Align minSdk with HEV
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text(encoding="utf-8")

          if "minSdk = 26" in text:
              text = text.replace(
                  "minSdk = 26",
                  "minSdk = 29",
                  1
              )

          elif "minSdk = 29" not in text:
              raise SystemExit(
                  "Could not find minSdk declaration."
              )

          path.write_text(text, encoding="utf-8")

          print("minSdk = 29")
          PY

      # ============================================================
      # 18. Copy HEV AAR
      # ============================================================
      - name: Copy HEV AAR into app
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/hev-android/hev-socks5-tunnel.aar" \
            app/libs/

          test -s app/libs/hev-socks5-tunnel.aar

          echo
          ls -lh app/libs/*.aar

      # ============================================================
      # 19. Suppress compileSdk warning
      # ============================================================
      - name: Configure Android build properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
            "^android.suppressUnsupportedCompileSdk=35" \
            gradle.properties
          then
            printf '\nandroid.suppressUnsupportedCompileSdk=35\n' \
              >> gradle.properties
          fi

          echo "compileSdk 35 warning suppressed."

      # ============================================================
      # 20. Verify project
      # ============================================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure: OK"

      # ============================================================
      # 21. Clean
      # ============================================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            clean \
            --stacktrace

      # ============================================================
      # 22. Run unit tests
      # ============================================================
      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:testDebugUnitTest \
            --stacktrace

      # ============================================================
      # 23. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      # ============================================================
      # 24. Verify APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              -print -quit
          )"

          test -n "$APK"

          echo
          echo "========================================"
          echo "WEIRDNET APK BUILD SUCCESSFUL"
          echo "========================================"
          echo
          ls -lh "$APK"
          echo
          echo "APK:"
          echo "$APK"

      # ============================================================
      # 25. Upload APK
      # ============================================================
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
