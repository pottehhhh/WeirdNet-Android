name: WEIRDNET Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  HEV_COMMIT: 941c758101385d145c66210ac88991daaf27d4b6
  GRADLE_VERSION: "8.7"

jobs:
  build:
    name: Build WEIRDNET Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;27.0.12077973"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "WeirdNet" ]; then
            echo "WeirdNet directory already exists."
            exit 0
          fi

          ZIP="$(find . -maxdepth 3 -type f -name '*.zip' | head -1 || true)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

      - name: Set project root
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "WeirdNet/settings.gradle.kts" ]; then
            PROJECT_ROOT="WeirdNet"
          elif [ -f "settings.gradle.kts" ]; then
            PROJECT_ROOT="."
          elif [ -f "extracted/WeirdNet/settings.gradle.kts" ]; then
            PROJECT_ROOT="extracted/WeirdNet"
          else
            SETTINGS_FILE="$(find . -type f -name settings.gradle.kts -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi

            PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
          fi

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_ROOT"

      # Run #12 failed here:
      # WireGuardEngine.kt:
      # Unresolved reference 'peerRx'
      # Unresolved reference 'peerTx'
      #
      # Use the aggregate Statistics API instead.
      - name: Fix WireGuard traffic API
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt"

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          old_peer_api = """var totalRx = 0L
          var totalTx = 0L
          for (peer in stats.peers()) {
              totalRx += stats.peerRx(peer)
              totalTx += stats.peerTx(peer)
          }"""

          old_old_api = """var totalRx = 0L
          var totalTx = 0L
          for (peer in stats.peers()) {
              totalRx += stats.rx(peer)
              totalTx += stats.tx(peer)
          }"""

          new_api = """val totalRx = stats.totalRx()
          val totalTx = stats.totalTx()"""

          if old_peer_api in s:
              s = s.replace(old_peer_api, new_api)
              print("Replaced peerRx/peerTx API.")
          elif old_old_api in s:
              s = s.replace(old_old_api, new_api)
              print("Replaced old rx/tx API.")
          else:
              s = s.replace("stats.peerRx(peer)", "stats.totalRx()")
              s = s.replace("stats.peerTx(peer)", "stats.totalTx()")
              s = s.replace("stats.rx(peer)", "stats.totalRx()")
              s = s.replace("stats.tx(peer)", "stats.totalTx()")
              print("Applied fallback API replacement.")

          p.write_text(s)
          PY

          echo "WireGuard traffic code:"
          grep -n -A12 -B3 "currentTraffic" "$FILE"

      - name: Fix missing Compose padding import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/ui/WeirdNetNavHost.kt"

          if [ ! -f "$FILE" ]; then
            exit 0
          fi

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "Modifier.padding(" not in s:
              raise SystemExit(0)

          imp = "import androidx.compose.foundation.layout.padding"

          if imp not in s:
              lines = s.splitlines()

              last_import = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      last_import = i

              lines.insert(last_import + 1, imp)
              p.write_text("\n".join(lines) + "\n")

              print("Added Compose padding import.")
          else:
              print("Padding import already exists.")
          PY

      - name: Fix Accompanist rationale import
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/ui/screens/QrScanScreen.kt"

          if [ ! -f "$FILE" ]; then
            exit 0
          fi

          python - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "shouldShowRationale" not in s:
              raise SystemExit(0)

          imp = "import com.google.accompanist.permissions.shouldShowRationale"

          if imp not in s:
              lines = s.splitlines()

              last_import = 0
              for i, line in enumerate(lines):
                  if line.startswith("import "):
                      last_import = i

              lines.insert(last_import + 1, imp)
              p.write_text("\n".join(lines) + "\n")

              print("Added shouldShowRationale import.")
          else:
              print("Rationale import already exists.")
          PY

      - name: Verify WireGuard fix
        shell: bash
        run: |
          set -euo pipefail

          FILE="$PROJECT_ROOT/app/src/main/java/ir/weirdnet/client/core/wireguard/WireGuardEngine.kt"

          if grep -q "peerRx(peer)" "$FILE"; then
            echo "ERROR: peerRx(peer) still exists."
            exit 1
          fi

          if grep -q "peerTx(peer)" "$FILE"; then
            echo "ERROR: peerTx(peer) still exists."
            exit 1
          fi

          if ! grep -q "stats.totalRx()" "$FILE"; then
            echo "ERROR: totalRx() not found."
            exit 1
          fi

          if ! grep -q "stats.totalTx()" "$FILE"; then
            echo "ERROR: totalTx() not found."
            exit 1
          fi

          echo "WireGuard API fix verified."

      - name: Download Xray AAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PROJECT_ROOT/app/libs"

          curl -fL \
            --retry 5 \
            --retry-all-errors \
            -o "$PROJECT_ROOT/app/libs/AndroidLibXrayLite.aar" \
            "https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/AndroidLibXrayLite.aar"

          ls -lh "$PROJECT_ROOT/app/libs/AndroidLibXrayLite.aar"

      - name: Build HEV
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hev-android

          mkdir -p hev-android

          git clone \
            --depth 1 \
            https://github.com/heiher/hev-socks5-tunnel.git \
            hev-android/jni

          cd hev-android/jni

          git fetch --depth 1 origin "$HEV_COMMIT"
          git checkout "$HEV_COMMIT"

          git submodule update --init --recursive

          cd ..

          ln -sf . jni

          export NDK_PROJECT_PATH="$PWD"
          export NDK_APPLICATION_MK="$PWD/jni/Application.mk"

          "$ANDROID_HOME/ndk/27.0.12077973/ndk-build" \
            NDK_PROJECT_PATH="$PWD" \
            NDK_APPLICATION_MK="$PWD/jni/Application.mk" \
            V=1

          echo "HEV native libraries:"
          find . -type f \
            \( -name "*.so" -o -name "*.a" \) \
            -print

      - name: Package HEV AAR
        shell: bash
        run: |
          set -euo pipefail

          rm -rf hev-aar
          mkdir -p hev-aar/jni

          FOUND=0

          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            SRC="$(find hev-android \
              -type f \
              \( -path "*/libs/$ABI/*.so" -o -path "*/obj/local/$ABI/*.so" \) \
              -print -quit || true)"

            if [ -n "$SRC" ]; then
              mkdir -p "hev-aar/jni/$ABI"
              cp "$SRC" "hev-aar/jni/$ABI/"
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "ERROR: HEV .so files not found."
            find hev-android -type f | sort
            exit 1
          fi

          cd hev-aar
          zip -qr ../hev-socks5-tunnel.aar .
          cd ..

          cp hev-socks5-tunnel.aar \
            "$PROJECT_ROOT/app/libs/hev-socks5-tunnel.aar"

          ls -lh "$PROJECT_ROOT/app/libs/hev-socks5-tunnel.aar"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          touch "$PROJECT_ROOT/gradle.properties"

          if ! grep -q \
            "^android.suppressUnsupportedCompileSdk=35$" \
            "$PROJECT_ROOT/gradle.properties"; then

            echo "android.suppressUnsupportedCompileSdk=35" \
              >> "$PROJECT_ROOT/gradle.properties"
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Gradle version
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle --version

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:testDebugUnitTest

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WeirdNet-Debug-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
